name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Pytest
        run: pytest
      - name: Offline demo
        run: python -m tero demo --offline --yes --carpeta examples/carpeta-demo

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install and test OpenTUI
        working-directory: tui
        run: |
          bun install
          bun test src
